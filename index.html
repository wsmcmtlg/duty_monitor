<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公安供电所值班监控 · 查询中心</title>
<style>
  :root{--primary:#1F4E79;--primary-light:#2E75B6;--bg:#eef2f7;--card:#fff;--text:#2c3e50;--muted:#7f8c8d;--ok:#27ae60;--warn:#e67e22;--bad:#c0392b;--border:#dfe6ec;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
  .header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:14px 22px;flex-shrink:0;}
  .header h1{font-size:18px;font-weight:600;}
  .header p{font-size:12px;opacity:.85;margin-top:4px;}
  .main{flex:1;display:flex;gap:16px;padding:16px 20px;overflow:hidden;}
  .side{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
  .content{flex:1;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
  .card{background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:16px;}
  .card h2{font-size:14px;color:var(--primary);border-left:4px solid var(--primary-light);padding-left:8px;margin-bottom:12px;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
  .field input:focus{outline:none;border-color:var(--primary-light);}
  .field .hint{font-size:10px;color:var(--muted);margin-top:3px;}
  .btn{width:100%;padding:9px;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-top:6px;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-light);}
  .btn-secondary{background:#eef2f7;color:var(--primary);}
  .sum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .s{flex:1;min-width:105px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
  .s .n{font-size:22px;font-weight:700;color:var(--primary);}
  .s .l{font-size:11px;color:var(--muted);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:500;background:#f8fafc;}
  .st{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;}
  .st.ok{background:#e8f8ef;color:var(--ok);}.st.warn{background:#fdf3e7;color:var(--warn);}
  .report-link{display:block;padding:8px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;text-decoration:none;color:var(--text);background:#fafbfc;font-size:12px;}
  .report-link:hover{border-color:var(--primary-light);}
  .report-link .meta{color:var(--muted);font-size:11px;margin-top:2px;}
  .empty{color:var(--muted);font-size:12px;padding:10px 0;text-align:center;}
  .msg{padding:8px 12px;border-radius:6px;font-size:12px;margin-top:10px;display:none;}
  .msg.ok{display:block;background:#e8f8ef;color:var(--ok);}
  .msg.err{display:block;background:#fdeaea;color:#c0392b;}
  .note{font-size:11px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:6px;padding:8px;margin-top:10px;}
  .scroll{overflow-y:auto;}
  @media(max-width:900px){.main{flex-direction:column;overflow-y:auto;}.side{width:100%;}}
</style>
</head>
<body>
<div class="header">
  <h1>国网公安县供电公司 · 供电所值班监控查询中心</h1>
  <p>数据由本地值班监控系统自动采集更新 · 每日自动同步</p>
</div>

<div class="main">
  <!-- 左侧：参数配置 -->
  <div class="side">
    <div class="card">
      <h2>参数配置</h2>
      <div class="field"><label>白天开始小时</label><input type="number" id="dayStart" min="0" max="23"></div>
      <div class="field"><label>白天结束小时</label><input type="number" id="dayEnd" min="0" max="23"></div>
      <div class="field"><label>白天间隔（小时）</label><input type="number" id="dayInterval" min="1" max="12"></div>
      <div class="field"><label>夜间间隔（小时）</label><input type="number" id="nightInterval" min="1" max="12"></div>
      <div class="field"><label>随机分钟（起）</label><input type="number" id="randLo" min="0" max="55"></div>
      <div class="field"><label>随机分钟（止）</label><input type="number" id="randHi" min="0" max="59"></div>
      <div class="field"><label>每日报告时间</label><input type="time" id="reportTime"></div>
      <div class="field"><label>报告前几天</label><input type="number" id="reportPrev" min="1" max="30"></div>
      <div class="field"><label>GitHub Token（用于保存配置，仅存本浏览器）</label>
        <input type="password" id="ghToken" placeholder="ghp_...">
        <div class="hint">建议用只读+仓库写权限的最小 Token，请勿泄露</div>
      </div>
      <button class="btn btn-primary" onclick="saveConfig()">保存配置到云端</button>
      <button class="btn btn-secondary" onclick="loadSchedule()">重新加载</button>
      <div class="msg" id="cfgMsg"></div>
      <div class="note">配置保存在 GitHub 仓库 schedule.json（不含密钥）。本地调度器会在同步时拉取生效。请在可信设备上保存配置。</div>
    </div>
  </div>

  <!-- 右侧：报表 -->
  <div class="content">
    <div class="card">
      <h2>总体情况</h2>
      <div class="sum">
        <div class="s"><div class="n" id="suTotal">-</div><div class="l">供电所</div></div>
        <div class="s"><div class="n" id="suChecks">-</div><div class="l">累计查岗</div></div>
        <div class="s"><div class="n" id="suEmpty">-</div><div class="l">累计无人</div></div>
        <div class="s"><div class="n" id="suRate">-</div><div class="l">在岗率</div></div>
        <div class="s"><div class="n" id="suDate">-</div><div class="l">更新日期</div></div>
      </div>
    </div>
    <div class="card scroll">
      <h2>各供电所查岗统计</h2>
      <div id="tableWrap"><div class="empty">加载中...</div></div>
    </div>
    <div class="card scroll">
      <h2>值班报告</h2>
      <div id="reportWrap"><div class="empty">加载中...</div></div>
    </div>
  </div>
</div>

<script>
function $(id){return document.getElementById(id);}
function showMsg(id,t,ok){const el=$(id);el.textContent=t;el.className='msg '+(ok?'ok':'err');setTimeout(()=>el.className='msg',4000);}
const REPO='wsmcmtlg/duty_monitor'; const RAW='https://raw.githubusercontent.com/wsmcmtlg/duty_monitor/main';

async function loadSchedule(){
  try{
    const r=await fetch(RAW+'/schedule.json?t='+Date.now());
    const s=await r.json();
    $('dayStart').value=s.day.start_hour;$('dayEnd').value=s.day.end_hour;
    $('dayInterval').value=s.day.interval_hours;$('nightInterval').value=s.night.interval_hours;
    $('randLo').value=s.random_minute_range[0];$('randHi').value=s.random_minute_range[1];
    $('reportTime').value=s.report_time;$('reportPrev').value=s.report_previous_days;
  }catch(e){showMsg('cfgMsg','配置加载失败',false);}
}
async function saveConfig(){
  const tok=$('ghToken').value.trim();
  if(!tok){showMsg('cfgMsg','请先填写GitHub Token',false);return;}
  const schedule={day:{start_hour:+$('dayStart').value,end_hour:+$('dayEnd').value,interval_hours:+$('dayInterval').value},night:{interval_hours:+$('nightInterval').value},random_minute_range:[+$('randLo').value,+$('randHi').value],report_time:$('reportTime').value,report_previous_days:+$('reportPrev').value};
  try{
    // 获取当前文件的SHA
    const meta=await fetch('https://api.github.com/repos/'+REPO+'/contents/schedule.json',{headers:{Authorization:'Bearer '+tok}});
    const metaJ=await meta.json(); const sha=metaJ.sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(schedule,null,2))));
    const body={message:'更新调度配置',content,sha};
    const rr=await fetch('https://api.github.com/repos/'+REPO+'/contents/schedule.json',{method:'PUT',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(rr.ok){showMsg('cfgMsg','配置已保存到云端，本地同步后生效',true);localStorage.setItem('gh_token',tok);}
    else{const e=await rr.json();showMsg('cfgMsg','保存失败: '+(e.message||rr.status),false);}
  }catch(e){showMsg('cfgMsg','保存失败: '+e,false);}
}
async function load(){
  try{
    const r=await fetch('summary.json?t='+Date.now()); if(!r.ok) throw 0; const d=await r.json();
    document.title='公安供电所值班监控 · '+d.date;
    $('suTotal').textContent=d.total_su||'-';$('suChecks').textContent=d.total_checks||'-';
    $('suEmpty').textContent=d.total_empty||'-';$('suRate').textContent=(d.rate!=null?(d.rate*100).toFixed(1)+'%':'-');
    $('suDate').textContent=d.date||'-';
    const rows=d.summary||[];let h='<table><tr><th>供电所</th><th>查岗</th><th>在岗</th><th>无人</th><th>离线</th><th>在岗率</th><th>状态</th></tr>';
    rows.forEach(a=>{const r=a.duty_rate!=null?(a.duty_rate*100).toFixed(1)+'%':'-';const st=a.empty_checks>0?'<span class="st warn">有无人</span>':'<span class="st ok">正常</span>';
      h+=`<tr><td>${a.name}</td><td>${a.checks}</td><td>${a.person_checks}</td><td>${a.empty_checks}</td><td>${a.offline}</td><td>${r}</td><td>${st}</td></tr>`;});
    $('tableWrap').innerHTML=rows.length?h:'<div class="empty">暂无统计数据</div>';
    const reps=d.reports||[];let rh='';
    reps.forEach(f=>{rh+=`<a class="report-link" href="${f.file}" download><div>${f.name}</div><div class="meta">${f.size} KB · ${f.mtime}</div></a>`;});
    $('reportWrap').innerHTML=reps.length?rh:'<div class="empty">暂无报告</div>';
  }catch(e){$('tableWrap').innerHTML='<div class="empty">数据加载失败或未同步</div>';$('reportWrap').innerHTML='<div class="empty">暂无报告</div>';}
}
// 恢复已存token
const saved=localStorage.getItem('gh_token'); if(saved)$('ghToken').value=saved;
loadSchedule(); load();
</script>
</body>
</html>
